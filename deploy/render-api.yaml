services:
  - type: web
    name: spatial-monitor-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: SM_API_KEYS_JSON
        sync: false
      - key: SM_API_ALLOWED_ORIGINS
        sync: false
