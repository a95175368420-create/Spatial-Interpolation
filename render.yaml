# Default Blueprint: one personal graphical test site; no API service or API key needed.
services:
  - type: web
    name: spatial-monitor-personal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: spatial-monitor serve --address 0.0.0.0 --port 8501
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: SM_APP_MODE
        value: personal
      - key: SM_TEST_PASSWORD
        sync: false
      - key: SM_DEMO_PATH
        value: /app/examples/demo
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "16"
